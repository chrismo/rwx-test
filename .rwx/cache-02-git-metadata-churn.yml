# Claim under test (NOT YET VALIDATED — see README status table):
#   Does `.git` metadata bust the cache key of a task that consumes a clone?
#
# This is a real open question that cost a peer session hours. They enabled
# caching on a test task with an all-negated filter (`!docs/**`), expecting
# docs-only pushes to skip the suite. The shards re-ran anyway, and they could
# not tell which of these was true:
#
#   (a) benign — CLI-triggered runs and push-triggered runs simply don't share
#       a cache, so their validation run could never have seeded the push run;
#   (b) a real gap — `.git` (HEAD, refs, logs) changes on every single commit,
#       and an all-negated filter still includes it, so the key busts every
#       push and the caching they shipped buys nothing.
#
# Test 03 settles (a). This one settles (b), by giving three tasks the same
# clone with different filters and comparing keys across two commits:
#
#   unfiltered   — whole clone, .git included
#   excludes-git — everything except .git
#   source-only  — an allowlist that structurally cannot contain .git
#
# If `unfiltered` churns while `excludes-git` holds steady, `.git` is the
# culprit and every "use: code" task wants `!.git/**` in its filter.
#
# Requires two runs at genuinely different commits. `rwx run` bases the clone
# on the last *pushed* commit and patches local edits on top, so exercising
# this properly means two real commits — see test/cases/02.

on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.1.1

tasks:
  - key: code
    call: git/clone 2.0.8
    with:
      repository: https://github.com/chrismo/rwx-test.git
      ref: ${{ init.commit-sha }}

  - key: unfiltered
    use: code
    run: |
      echo "workspace entries:"
      ls -a
      test -d .git && echo "confirmed: .git IS present in an unfiltered task"

  - key: excludes-git
    use: code
    filter:
      - '!.git/**'
    run: |
      ls -a
      test ! -e .git/HEAD && echo "confirmed: .git/HEAD excluded"

  - key: source-only
    use: code
    filter:
      - 'sample/**'
    run: |
      ls -a
      test ! -e .git && echo "confirmed: allowlist cannot contain .git"
