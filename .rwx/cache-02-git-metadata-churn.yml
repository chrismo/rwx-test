# Claim under test:
#   Does `.git` metadata bust the cache key of a task that consumes a clone?
#
# Origin: a peer session enabled caching on a test task with an all-negated
# filter (`!docs/**`), expecting docs-only pushes to skip the suite. Everything
# re-ran anyway. Their leading suspicion was `.git` — it changes on every
# commit, and an all-negated filter still includes it.
#
# Test 03 already ruled out the alternative explanation: CLI and push runs DO
# share a cache. So something really was moving the key.
#
# The surprise this test found: `git/clone` defaults to
# `preserve-git-dir: false`, so `.git` is not in the workspace at all unless
# you ask for it. The package docs are explicit that preserving it "will
# decrease the likelihood of cache hits when a file filter is not specified."
#
# So the experiment is three-way, across an EMPTY COMMIT — new SHA, new refs,
# byte-identical working tree, which isolates metadata from content:
#
#   no-git-dir              default clone      -> expect HELD  (no .git exists)
#   with-git-dir-unfiltered preserved, no filter -> expect MOVED (.git churns)
#   with-git-dir-filtered   preserved, !.git/** -> expect HELD  (filtered out)
#
# If that holds, the guidance is: a default clone is already immune, and
# `preserve-git-dir: true` is the thing that quietly destroys cache hits.

on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.1.1

tasks:
  # Default clone: .git is removed by the package's cleanup-git-dir step.
  - key: code
    call: git/clone 2.0.8
    with:
      repository: https://github.com/chrismo/rwx-test.git
      ref: ${{ init.commit-sha }}

  # Same clone, but keeping .git — as a repo would if it needed git operations.
  - key: code-with-git
    call: git/clone 2.0.8
    with:
      repository: https://github.com/chrismo/rwx-test.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true

  - key: no-git-dir
    use: code
    run: |
      ls -a
      test ! -e .git
      echo "confirmed: default git/clone leaves no .git in the workspace"

  - key: with-git-dir-unfiltered
    use: code-with-git
    run: |
      test -d .git
      echo "confirmed: preserve-git-dir kept .git"

  - key: with-git-dir-filtered
    use: code-with-git
    filter:
      - '!.git/**'
    run: |
      test ! -e .git/HEAD
      echo "confirmed: !.git/** removed the metadata again"
