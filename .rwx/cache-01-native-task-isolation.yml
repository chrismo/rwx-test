# Claim under test:
#   Two sibling tasks are independent cache units. Changing one task's inputs
#   does not change the other's cache key — no filter required.
#
# Method:
#   Run twice with a different `alpha-salt`. Only `alpha` consumes the salt.
#   Assert: alpha's CacheKey changes, beta's CacheKey is byte-identical.
#
# No `on: github:` trigger — this definition can only be started deliberately
# from the CLI, so pushes (and outside PRs) can never spend on it.

on:
  cli:

base:
  image: ubuntu:24.04
  config: rwx/base 1.1.1

tasks:
  - key: alpha
    run: echo "alpha $SALT" | tee alpha.txt
    env:
      SALT: ${{ init.alpha-salt }}

  - key: beta
    run: echo "beta is independent of alpha" | tee beta.txt
